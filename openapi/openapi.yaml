      description: Formación en Empresas Murcia. No usar `/fct`.
      operationId: listFemAlumnos
      security:
        - BearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de alumnos FEM
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FemAlumno'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fem/alumnos/{id}/horas:
    patch:
      tags: [FEM]
      summary: Actualizar horas cursadas
      description: Progreso sobre 500 horas de prácticas.
      operationId: patchFemAlumnoHoras
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FemHorasPatch'
      responses:
        '200':
          description: Horas actualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FemAlumno'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/dashboard/kpis:
    get:
      tags: [Dashboard]
      summary: KPIs del centro
      operationId: getDashboardKpis
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métricas consolidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardKpis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/retrasos:
    post:
      tags: [Retrasos]
      summary: Registrar retraso de un alumno
      description: |
        El docente solo registra el retraso (alumno, fecha, hora y modulo).
        El autor (`registrado_por_id`) se toma del JWT, nunca del cuerpo.
        Fecha futura -> 422. Duplicado mismo alumno/fecha/hora/modulo -> 409.
      operationId: createRetraso
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrasoCreate'
      responses:
        '201':
          description: Retraso registrado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retraso'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/retrasos/{id}:
    get:
      tags: [Retrasos]
      summary: Detalle de un retraso
      operationId: getRetraso
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Retraso solicitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retraso'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/alumnos/{id}/retrasos:
    get:
      tags: [Retrasos]
      summary: Historico de retrasos de un alumno
      description: |
        Historico individual del alumno en un curso escolar.
        Cada consulta queda registrada en auditoria (datos de menores).
      operationId: listAlumnoRetrasos
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: curso_escolar
          in: query
          required: false
          schema:
            type: string
            example: 2026/2027
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pagina de retrasos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrasoPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/notificaciones:
    get:
      tags: [Notificaciones]
      summary: Bandeja de notificaciones propias
      description: |
        Solo las del usuario autenticado. Las generan los servicios ante eventos;
        no existe POST de creacion desde la API.
      operationId: listNotificaciones
      security:
        - BearerAuth: []
      parameters:
        - name: leida
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pagina de notificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/notificaciones/{id}:
    patch:
      tags: [Notificaciones]
      summary: Marcar notificacion leida / no leida
      operationId: patchNotificacion
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacionPatch'
      responses:
        '200':
          description: Notificacion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/notificaciones/suscripciones:
    post:
      tags: [Notificaciones]
      summary: Registrar suscripcion Web Push
      operationId: createSuscripcionPush
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuscripcionPushCreate'
      responses:
        '200':
          description: Suscripcion ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionPush'
        '201':
          description: Suscripcion creada
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionPush'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/notificaciones/suscripciones/{id}:
    delete:
      tags: [Notificaciones]
      summary: Eliminar suscripcion Web Push
      operationId: deleteSuscripcionPush
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Suscripcion eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auditoria:
    get:
      tags: [Auditoria]
      summary: Consultar registro de auditoria
      description: |
        Solo lectura. Acciones tipicas: login, altas/bajas/roles, guardias,
        tickets, firma, exportacion RGPD y acceso a datos de alumnado.
      operationId: listAuditoria
      security:
        - BearerAuth: []
      parameters:
        - name: usuario_id
          in: query
          required: false
          schema:
            type: string
        - name: accion
          in: query
          required: false
          schema:
            type: string
        - name: recurso_tipo
          in: query
          required: false
          schema:
            type: string
        - name: recurso_id
          in: query
          required: false
          schema:
            type: string
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pagina de registros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroAuditoriaPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /health:
    get:
      tags: [Health]
      summary: Liveness
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Proceso vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness
      description: Comprueba disponibilidad de MongoDB y Redis.
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Dependencias listas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  mongo:
                    type: boolean
                  redis:
                    type: boolean
        '503':
          description: Dependencias no disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador del usuario (codificado en la URL)
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador del recurso (codificado en la URL)
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  responses:
    BadRequest:
      description: Peticion incorrecta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Peticion incorrecta
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: No autenticado
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: "Se requiere uno de estos roles: admin"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Recurso no encontrado
    Conflict:
      description: Conflicto (duplicado, solapamiento o transicion no valida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: El recurso ya existe
    UnprocessableEntity:
      description: Validacion fallida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'

  schemas:
    Role:
      type: string
      enum:
        - admin
        - directiva
        - jefatura
        - docente
        - tutor
        - responsable_ticket

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          description: Mensaje o lista de errores de validacion (estilo FastAPI)

    DetailMessage:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    GoogleAuthRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: ID token JWT emitido por Google Identity Services

    AccessTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Segundos de validez del access token

    UsuarioEstado:
      type: string
      enum: [pendiente, activo, inactivo]

    Usuario:
      type: object
      required: [id, name, email, departamento, roles, estado]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        estado:
          $ref: '#/components/schemas/UsuarioEstado'
        origen_alta:
          $ref: '#/components/schemas/OrigenAlta'
        dni:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true

    UsuarioPaginated:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    UsuarioCreate:
      type: object
      required: [name, email, departamento]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          default: [docente]
        estado:
          $ref: '#/components/schemas/UsuarioEstado'
          default: activo

    UsuarioMe:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            permisos:
              type: array
              items:
                type: string

    UsuarioPatch:
      type: object
      properties:
        name:
          type: string
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        estado:
          $ref: '#/components/schemas/UsuarioEstado'

    BloqueHorario:
      type: object
      required: [inicio, fin, tipo]
      properties:
        inicio:
          type: string
          example: "08:00"
        fin:
          type: string
          example: "09:00"
        tipo:
          type: string
          enum: [clase, guardia, reduccion]
        asignatura:
          type: string
        grupo:
          type: string
        aula:
          type: string

    Horario:
      type: object
      required: [usuario_id, dias]
      properties:
        usuario_id:
          type: string
        dias:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/BloqueHorario'
          description: Mapa dia -> bloques (lunes, martes, ...)

    Anuncio:
      type: object
      required: [id, titulo, cuerpo]
      properties:
        id:
          type: string
        titulo:
          type: string
        cuerpo:
          type: string
        departamento:
          type: string
          nullable: true
        fijado:
          type: boolean
          default: false
        expira_en:
          type: string
          format: date-time
          nullable: true
        creado_en:
          type: string
          format: date-time

    AnuncioCreate:
      type: object
      required: [titulo, cuerpo]
      properties:
        titulo:
          type: string
        cuerpo:
          type: string
        departamento:
          type: string
          nullable: true
        expira_en:
          type: string
          format: date-time
          nullable: true

    Guardia:
      type: object
      required: [id, fecha, franja, estado]
      description: |
        Distingue docente asignado por ronda (`asignado_id`) de quien realiza
        la guardia (`cubre_id`). Pueden no coincidir.
      properties:
        id:
          type: string
        fecha:
          type: string
          format: date
        franja:
          type: string
        ausente_id:
          type: string
          nullable: true
          description: Docente cuya ausencia genera el hueco de guardia
        asignado_id:
          type: string
          nullable: true
          description: Docente al que corresponde la guardia por ronda/contador
        cubre_id:
          type: string
          nullable: true
          description: Docente que finalmente realiza/cubre la guardia
        estado:
          type: string
          enum: [pendiente, asignada, cubierta]

    GuardiaAsignarRequest:
      type: object
      properties:
        fecha:
          type: string
          format: date
        franja:
          type: string

    GuardiaPatch:
      type: object
      properties:
        cubre_id:
          type: string
          description: Cambiar quien realiza la guardia (sin exigir cambio de asignado_id)
        estado:
          type: string
          enum: [pendiente, asignada, cubierta]

    AusenciaTipo:
      type: string
      enum: [generica, administrativa, extraescolar]

    AusenciaEstado:
      type: string
      enum: [registrada, pendiente_justificante, pendiente_firma, firmada]
      description: |
        Flujo genérico: registrada → (si genérica, tras la guardia) pendiente_justificante
        → pendiente_firma → firmada. Administrativa/extraescolar pueden omitir justificante.

    Ausencia:
      type: object
      required: [id, docente_id, tipo, estado, fecha_inicio, fecha_fin]
      properties:
        id:
          type: string
        docente_id:
          type: string
        tipo:
          $ref: '#/components/schemas/AusenciaTipo'
        estado:
          $ref: '#/components/schemas/AusenciaEstado'
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        motivo:
          type: string
          nullable: true
        franjas:
          type: array
          items:
            type: string
          description: Huecos horarios afectados; vacío o ausente = día completo
        justificante_url:
          type: string
          nullable: true
        firmada:
          type: boolean
          default: false
        firma_proveedor:
          allOf:
            - $ref: '#/components/schemas/FirmaProveedor'
          nullable: true
        creado_en:
          type: string
          format: date-time

    AusenciaCreate:
      type: object
      required: [tipo, fecha_inicio, fecha_fin]
      properties:
        tipo:
          $ref: '#/components/schemas/AusenciaTipo'
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        motivo:
          type: string
        franjas:
          type: array
          items:
            type: string
          description: Si se omite, se interpreta como día completo

    FirmaProveedor:
      type: string
      enum: [manuscrita, autofirma]
      description: |
        `manuscrita` = objetivo garantizado del proyecto.
        `autofirma` = mejor esfuerzo (certificado + AutoFirma en el equipo del usuario).

    FirmaRequest:
      type: object
      required: [proveedor, firma_base64]
      properties:
        proveedor:
          $ref: '#/components/schemas/FirmaProveedor'
        firma_base64:
          type: string
          description: |
            Imagen de la firma en base64 (PNG o JPEG), sin prefijo data-URL obligatorio.
            Con `manuscrita` es la captura en pantalla; con `autofirma` el payload
            que el cliente obtenga del proceso de firma.

    TicketTipo:
      type: string
      enum: [rmi, rrss, compras, otro]

    TicketEstado:
      type: string
      enum: [abierto, en_proceso, resuelto, cerrado]
      description: |
        Transiciones válidas: abierto → en_proceso → resuelto → cerrado.

    Ticket:
      type: object
      required: [id, tipo, estado, titulo]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TicketTipo'
        estado:
          $ref: '#/components/schemas/TicketEstado'
        titulo:
          type: string
        descripcion:
          type: string
        solicitante_id:
          type: string
        asignado_id:
          type: string
          nullable: true
        creado_en:
          type: string
          format: date-time

    TicketCreate:
      type: object
      required: [tipo, titulo]
      properties:
        tipo:
          $ref: '#/components/schemas/TicketTipo'
        titulo:
          type: string
        descripcion:
          type: string

    TicketPatch:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/TicketEstado'
        asignado_id:
          type: string

    Comentario:
      type: object
      required: [id, autor_id, cuerpo, creado_en]
      properties:
        id:
          type: string
        autor_id:
          type: string
        cuerpo:
          type: string
        creado_en:
          type: string
          format: date-time

    ComentarioCreate:
      type: object
      required: [cuerpo]
      properties:
        cuerpo:
          type: string
          minLength: 1

    FemAlumno:
      type: object
      required: [id, nombre, horas_cursadas, horas_totales]
      properties:
        id:
          type: string
        nombre:
          type: string
        empresa:
          type: string
        estado:
          type: string
        horas_cursadas:
          type: number
          minimum: 0
        horas_totales:
          type: number
          example: 500
        tutor_id:
          type: string

    FemHorasPatch:
      type: object
      required: [horas_cursadas]
      properties:
        horas_cursadas:
          type: number
          minimum: 0
          maximum: 500

    DashboardKpis:
      type: object
      properties:
        ausencias_hoy:

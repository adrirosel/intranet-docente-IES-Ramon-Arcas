          type: string
        accion:
          type: string
        recurso_tipo:
          type: string
        recurso_id:
          type: string
          nullable: true
        fecha:
          type: string
          format: date-time
        detalle:
          type: object
          nullable: true

    RegistroAuditoriaPaginated:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistroAuditoria'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

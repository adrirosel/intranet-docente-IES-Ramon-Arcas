          properties:
            p256dh:
              type: string
            auth:
              type: string
        dispositivo:
          type: string
          maxLength: 100

    SuscripcionPush:
      type: object
      required: [id, creada_en]
      description: Las claves de la suscripcion nunca se devuelven al cliente
      properties:
        id:
          type: string
        dispositivo:
          type: string
          nullable: true
        creada_en:
          type: string
          format: date-time

    RegistroAuditoria:
      type: object

openapi: 3.0.3
info:
  title: Intranet Docente IES Ramón Arcas Meca
  description: |
    API REST de la Intranet de Gestión Docente (Proyecto Intermodular 2º DAW).

    Prefijo funcional `/api/v1`. Autenticación JWT Bearer salvo login/refresh/health.

    Roles: `admin`, `directiva`, `jefatura`, `docente`, `tutor`, `responsable_ticket`.
    FEM = Formación en Empresas Murcia (no renombrar a FCT).
  version: 0.1.0
  contact:
    name: Proyecto Intermodular DAW — IES Ramón Arcas Meca

servers:
  - url: http://localhost:8000
    description: Desarrollo local

tags:
  - name: Auth
    description: OAuth Google, JWT, sesión
  - name: Usuarios
    description: Claustro, perfil y horarios
  - name: Anuncios
    description: Tablón segmentado por departamento
  - name: Guardias
    description: Cuadrante y asignación
  - name: Ausencias
    description: Registro, justificante, PDF y firma
  - name: Tickets
    description: Solicitudes RMI / RRSS / Compras y comentarios
  - name: FEM
    description: Formación en Empresas Murcia — alumnado y horas
  - name: Dashboard
    description: KPIs para equipo directivo
  - name: Retrasos
    description: Registro de retrasos del alumnado e historico individual
  - name: Notificaciones
    description: Bandeja de notificaciones y suscripciones Web Push
  - name: Auditoria
    description: Registro de acciones sensibles (solo lectura)
  - name: Health
    description: Liveness y readiness (Docker)

paths:
  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Login con Google OAuth
      description: |
        Recibe `id_token` de Google Identity Services.
        Emite access JWT en el body y refresh en cookie HttpOnly `refresh_token`.
        Sin restriccion de dominio; usuarios nuevos quedan en estado `pendiente`.
      operationId: authGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
            example:
              id_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Access token emitido (refresh en Set-Cookie)
          headers:
            Set-Cookie:
              description: Cookie HttpOnly refresh_token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token
      description: |
        Lee la cookie HttpOnly `refresh_token` (no usa Bearer).
        Valida el token opaco en Redis y emite un nuevo access JWT.
      operationId: authRefresh
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Nuevo access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: Invalida el refresh en Redis y borra la cookie.
      operationId: authLogout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sesión invalidada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
              example:
                detail: Sesion cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Usuario autenticado
      description: Identidad y roles para el arranque de la PWA.
      operationId: authMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil del usuario del JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioMe'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/usuarios:
    get:
      tags: [Usuarios]
      summary: Listado del claustro
      description: Requiere rol admin. Admite filtro y paginacion.
      operationId: listUsuarios
      security:
        - BearerAuth: []
      parameters:
        - name: departamento
          in: query
          required: false
          schema:
            type: string
          description: Filtra por departamento
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UsuarioEstado'
        - name: rol
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Role'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pagina de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Usuarios]
      summary: Alta manual de usuario
      description: El servidor asigna el id. Cabecera Location apunta al GET por id.
      operationId: createUsuario
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
            example:
              name: Pepa
              email: pepa@example.com
              departamento: FOL
              roles: [docente]
      responses:
        '201':
          description: Usuario creado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/usuarios/64f1a2b3c4d5e6f7a8b9c0d3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/usuarios/me:
    get:
      tags: [Usuarios]
      summary: Perfil propio
      operationId: getUsuariosMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Usuarios]
      summary: Rectificar datos propios (RGPD)
      description: Solo campos de perfil propios. Departamento, roles y estado los gestiona admin.
      operationId: patchUsuariosMe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioMePatch'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/usuarios/me/datos:
    get:
      tags: [Usuarios]
      summary: Exportar datos personales propios (RGPD)
      operationId: getUsuariosMeDatos
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Exportacion de datos personales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDatosPersonales'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/usuarios/me/horario:
    get:
      tags: [Usuarios]
      summary: Horario semanal propio
      operationId: getUsuariosMeHorario
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Horario del docente autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Horario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/usuarios/{id}/horario:
    get:
      tags: [Usuarios]
      summary: Horario semanal de un docente
      operationId: getUsuarioHorario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Horario del docente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Horario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener un usuario
      operationId: getUsuario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Usuarios]
      summary: Modificacion parcial de usuario
      description: "Ejemplo de uso — aprobar alta pendiente (`estado: activo`)."
      operationId: patchUsuario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioPatch'
            example:
              estado: activo
              departamento: Informatica
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/usuarios/{id}/roles:
    put:
      tags: [Usuarios]
      summary: Sustituir lista completa de roles
      description: |
        Reemplaza todos los roles. Impide dejar el sistema sin ningun admin (409).
        Alternativa equivalente a enviar `roles` en PATCH; este endpoint deja la intencion explicita.
      operationId: putUsuarioRoles
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRolesPut'
      responses:
        '200':
          description: Roles actualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/anuncios:
    get:
      tags: [Anuncios]
      summary: Feed del tablón
      description: |
        Feed segmentado (no paginado). Excepción a la norma `{items,page,limit,total}`:
        el tablón devuelve el conjunto filtrado vigente (sin caducados).
      operationId: listAnuncios
      security:
        - BearerAuth: []
      parameters:
        - name: departamento
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de anuncios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anuncio'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Anuncios]
      summary: Publicar anuncio
      operationId: createAnuncio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnuncioCreate'
      responses:
        '201':
          description: Anuncio creado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anuncio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/anuncios/{id}/fijar:
    patch:
      tags: [Anuncios]
      summary: Fijar o desfijar anuncio
      operationId: fijarAnuncio
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fijado]
              properties:
                fijado:
                  type: boolean
      responses:
        '200':
          description: Anuncio actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anuncio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/guardias:
    get:
      tags: [Guardias]
      summary: Consultar cuadrante
      description: |
        Listado filtrado por fecha/franja (no paginado). Excepción a la norma
        `{items,page,limit,total}`: el cuadrante se consulta por día.
      operationId: listGuardias
      security:
        - BearerAuth: []
      parameters:
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-10-02"
        - name: franja
          in: query
          required: false
          schema:
            type: string
          description: Identificador de franja horaria
      responses:
        '200':
          description: Lista de guardias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guardia'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/guardias/asignar:
    post:
      tags: [Guardias]
      summary: Ejecutar asignación por rondas
      description: |
        Acción de negocio. La lógica vive en `services/guardias_service` (Fase 3).

        **Regla de asignación (cerrada):**
        1. En cada hueco puede haber más de un docente disponible.
        2. El sistema mantiene, por docente y por hueco horario concreto, un contador
           de guardias realizadas.
        3. Al iniciar ronda, si hay empate en el contador entre disponibles del hueco,
           la selección es aleatoria.
        4. La comparación del contador es solo entre docentes disponibles en ese hueco,
           nunca contra todo el claustro.
        5. Si el docente `asignado_id` no puede asistir, otro disponible cubre
           (`cubre_id`), aunque tenga más guardias realizadas; en rondas siguientes
           se prioriza de nuevo a quien tenga menos.
        6. `asignado_id` (a quien corresponde por ronda) y `cubre_id` (quien realiza)
           pueden diferir.
      operationId: asignarGuardias
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardiaAsignarRequest'
      responses:
        '200':
          description: Guardias asignadas en la ejecución
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guardia'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/guardias/{id}:
    patch:
      tags: [Guardias]
      summary: Modificar docente que cubre la guardia
      description: |
        Permite cambiar `cubre_id` (quien realiza) sin alterar necesariamente
        `asignado_id` (quien correspondía por ronda).
      operationId: patchGuardia
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardiaPatch'
      responses:
        '200':
          description: Guardia actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guardia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/ausencias:
    post:
      tags: [Ausencias]
      summary: Registrar ausencia
      operationId: createAusencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AusenciaCreate'
            example:
              tipo: generica
              fecha_inicio: "2026-10-03"
              fecha_fin: "2026-10-03"
              motivo: Visita medica
      responses:
        '201':
          description: Ausencia creada
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/ausencias/64f1a2b3c4d5e6f7a8b9c0d5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ausencia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/ausencias/{id}:
    get:
      tags: [Ausencias]
      summary: Detalle de una ausencia
      description: Requiere ser dueño de la ausencia (o `admin` / `jefatura`).
      operationId: getAusencia
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Ausencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ausencia'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ausencias/{id}/justificante:
    post:
      tags: [Ausencias]
      summary: Subir justificante
      description: Requiere ser dueño de la ausencia (propiedad, no rol).
      operationId: uploadJustificante
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Justificante asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/ausencias/{id}/pdf:
    get:
      tags: [Ausencias]
      summary: Descargar PDF de la ausencia
      description: Requiere ser dueño de la ausencia.
      operationId: getAusenciaPdf
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Documento PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ausencias/{id}/firma:
    post:
      tags: [Ausencias]
      summary: Insertar firma
      description: |
        Incrusta la firma en el PDF de la ausencia.

        - `proveedor: manuscrita` — objetivo garantizado (imagen capturada en pantalla, PNG/JPEG en base64).
        - `proveedor: autofirma` — mejor esfuerzo (depende de certificado y AutoFirma en el cliente).
      operationId: firmarAusencia
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmaRequest'
      responses:
        '200':
          description: Ausencia firmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ausencia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tickets:
    get:
      tags: [Tickets]
      summary: Listar tickets
      description: |
        Listado filtrado por tipo/estado (no paginado). Excepción a la norma
        `{items,page,limit,total}`: cola operativa acotada por filtros.
      operationId: listTickets
      security:
        - BearerAuth: []
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketTipo'
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketEstado'
      responses:
        '200':
          description: Lista de tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tickets]
      summary: Crear ticket
      operationId: createTicket
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: Ticket creado
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/tickets/64f1a2b3c4d5e6f7a8b9c0d4
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tickets/{id}:
    patch:
      tags: [Tickets]
      summary: Transición de estado del ticket
      description: |
        Máquina de estados: `abierto` → `en_proceso` → `resuelto` → `cerrado`.
        Transiciones inválidas → 422.
      operationId: patchTicket
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketPatch'
      responses:
        '200':
          description: Ticket actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tickets/{id}/comentarios:
    get:
      tags: [Tickets]
      summary: Listar comentarios del ticket
      operationId: listTicketComentarios
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Hilo de comentarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comentario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tickets]
      summary: Añadir comentario
      operationId: createTicketComentario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComentarioCreate'
      responses:
        '201':
          description: Comentario creado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comentario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/fem/alumnos:
    get:
      tags: [FEM]

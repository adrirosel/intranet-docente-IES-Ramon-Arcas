        guardias_pendientes:
          type: integer
        tickets_abiertos:
          type: integer
        docentes_activos:
          type: integer
        alumnos_fem_activos:
          type: integer

    OrigenAlta:
      type: string
      enum: [manual, oauth]

    UsuarioMePatch:
      type: object
      additionalProperties: false
      description: |
        Campos que el propio usuario puede rectificar (RGPD).
        Para autocompletar PDF sin datos OAuth se usan `name` y, si existen en perfil,
        `dni` / `telefono` (opcionales).
      properties:
        name:
          type: string
          minLength: 1
        dni:
          type: string
          minLength: 1
        telefono:
          type: string
          minLength: 1

    UsuarioRolesPut:
      type: object
      required: [roles]
      additionalProperties: false
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'

    UsuarioDatosPersonales:
      type: object
      description: Exportacion de datos personales (derecho de acceso RGPD)
      required: [usuario, exportado_en]
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        exportado_en:
          type: string
          format: date-time
        ausencias:
          type: array
          items:
            type: object
        tickets:
          type: array
          items:
            type: object
        suscripciones_push:
          type: array
          items:
            $ref: '#/components/schemas/SuscripcionPush'

    RetrasoCreate:
      type: object
      required: [alumno_id, fecha, hora, modulo]
      additionalProperties: false
      properties:
        alumno_id:
          type: string
        fecha:
          type: string
          format: date
        hora:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "08:20"
        modulo:
          type: string
          minLength: 1

    Retraso:
      type: object
      required: [id, alumno_id, fecha, hora, modulo, curso_escolar, registrado_por_id]
      properties:
        id:
          type: string
        alumno_id:
          type: string
        fecha:
          type: string
          format: date
        hora:
          type: string
        modulo:
          type: string
        grupo:
          type: string
        curso_escolar:
          type: string
          example: 2026/2027
        registrado_por_id:
          type: string
        creado_en:
          type: string
          format: date-time

    RetrasoPaginated:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Retraso'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    NotificacionTipo:
      type: string
      enum: [anuncio_destacado, guardia_asignada, horario_modificado, ticket_estado]

    Notificacion:
      type: object
      required: [id, tipo, titulo, leida, creada_en]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/NotificacionTipo'
        titulo:
          type: string
        mensaje:
          type: string
        recurso_tipo:
          type: string
          nullable: true
        recurso_id:
          type: string
          nullable: true
        leida:
          type: boolean
        creada_en:
          type: string
          format: date-time

    NotificacionPaginated:
      type: object
      required: [items, page, limit, total, no_leidas]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        no_leidas:
          type: integer

    NotificacionPatch:
      type: object
      required: [leida]

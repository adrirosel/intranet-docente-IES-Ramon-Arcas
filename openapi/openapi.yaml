components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador del usuario (codificado en la URL)
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador del recurso (codificado en la URL)
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  responses:
    BadRequest:
      description: Peticion incorrecta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Peticion incorrecta
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: No autenticado
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Se requiere uno de estos roles: admin
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Recurso no encontrado
    Conflict:
      description: Conflicto (duplicado, solapamiento o transicion no valida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: El recurso ya existe
    UnprocessableEntity:
      description: Validacion fallida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'

  schemas:
    Role:
      type: string
      enum:
        - admin
        - directiva
        - jefatura
        - docente
        - tutor
        - responsable_ticket

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          description: Mensaje o lista de errores de validacion (estilo FastAPI)

    DetailMessage:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ResourceAck:
      type: object
      description: Respuesta generica de accion de negocio (modulos pendientes)
      additionalProperties: true

    GoogleAuthRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: ID token JWT emitido por Google Identity Services

    AccessTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Segundos de validez del access token

    UsuarioEstado:
      type: string
      enum: [pendiente, activo, inactivo]

    Usuario:
      type: object
      required: [id, name, email, departamento, roles, estado]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        estado:
          $ref: '#/components/schemas/UsuarioEstado'
        origen_alta:
          $ref: '#/components/schemas/OrigenAlta'

    UsuarioPaginated:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    UsuarioCreate:
      type: object
      required: [name, email, departamento]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          default: [docente]
        estado:
          $ref: '#/components/schemas/UsuarioEstado'
          default: activo

    UsuarioMe:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            permisos:
              type: array
              items:
                type: string

    UsuarioPatch:
      type: object
      properties:
        name:
          type: string
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        estado:
          $ref: '#/components/schemas/UsuarioEstado'

    BloqueHorario:
      type: object
      required: [inicio, fin, tipo]
      properties:
        inicio:
          type: string
          example: "08:00"
        fin:
          type: string
          example: "09:00"
        tipo:
          type: string
          enum: [clase, guardia, reduccion]
        asignatura:
          type: string
        grupo:
          type: string
        aula:
          type: string

    Horario:
      type: object
      required: [usuario_id, dias]
      properties:
        usuario_id:
          type: string
        dias:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/BloqueHorario'
          description: Mapa dia -> bloques (lunes, martes, ...)

    Anuncio:
      type: object
      required: [id, titulo, cuerpo]
      properties:
        id:
          type: string
        titulo:
          type: string
        cuerpo:
          type: string
        departamento:
          type: string
          nullable: true
        fijado:
          type: boolean
          default: false
        expira_en:
          type: string
          format: date-time
          nullable: true
        creado_en:
          type: string
          format: date-time
      example:
        id: "64f1a2b3c4d5e6f7a8b9c0a2"
        titulo: Entrega de memorias DAW
        cuerpo: Recordad subir la memoria intermodular antes del 30 de octubre.
        departamento: Informatica
        fijado: false
        expira_en: "2026-10-30T23:59:59Z"
        creado_en: "2026-10-05T10:15:00Z"

    AnuncioCreate:
      type: object
      required: [titulo, cuerpo]
      properties:
        titulo:
          type: string
        cuerpo:
          type: string
        departamento:
          type: string
          nullable: true
        expira_en:
          type: string
          format: date-time
          nullable: true
      example:
        titulo: Entrega de memorias DAW
        cuerpo: Recordad subir la memoria intermodular antes del 30 de octubre.
        departamento: Informatica
        expira_en: "2026-10-30T23:59:59Z"

    Guardia:
      type: object
      required: [id, fecha, franja]
      properties:
        id:
          type: string
        fecha:
          type: string
          format: date
        franja:
          type: string
        ausente_id:
          type: string
          nullable: true
        cubre_id:
          type: string
          nullable: true
        estado:
          type: string
          enum: [pendiente, asignada, cubierta]

    GuardiaAsignarRequest:
      type: object
      properties:
        fecha:
          type: string
          format: date
        franja:
          type: string

    GuardiaPatch:
      type: object
      properties:
        cubre_id:
          type: string
        estado:
          type: string
          enum: [pendiente, asignada, cubierta]

    AusenciaTipo:
      type: string
      enum: [generica, administrativa, extraescolar]

    AusenciaCreate:
      type: object
      required: [tipo, fecha_inicio, fecha_fin]
      properties:
        tipo:
          $ref: '#/components/schemas/AusenciaTipo'
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        motivo:
          type: string

    FirmaRequest:
      type: object
      properties:
        firma_base64:
          type: string
          description: Imagen o payload de firma (formato PENDIENTE DE DECISIÓN)
        proveedor:
          type: string
          example: autofirma

    TicketTipo:
      type: string
      enum: [rmi, rrss, compras, otro]

    TicketEstado:
      type: string
      enum: [abierto, en_proceso, resuelto, cerrado]
      description: |
        Transiciones válidas: abierto → en_proceso → resuelto → cerrado.

    Ticket:
      type: object
      required: [id, tipo, estado, titulo]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TicketTipo'
        estado:
          $ref: '#/components/schemas/TicketEstado'
        titulo:
          type: string
        descripcion:
          type: string
        solicitante_id:
          type: string
        asignado_id:
          type: string
          nullable: true
        creado_en:
          type: string
          format: date-time
      example:
        id: "64f1a2b3c4d5e6f7a8b9c0d4"
        tipo: rmi
        estado: abierto
        titulo: Proyector aula 12 no enciende
        descripcion: No da imagen desde esta manana.
        solicitante_id: "64f1a2b3c4d5e6f7a8b9c0b1"
        asignado_id: null
        creado_en: "2026-10-06T09:30:00Z"

    TicketCreate:
      type: object
      required: [tipo, titulo]
      properties:
        tipo:
          $ref: '#/components/schemas/TicketTipo'
        titulo:
          type: string
        descripcion:
          type: string
      example:
        tipo: rmi
        titulo: Proyector aula 12 no enciende
        descripcion: No da imagen desde esta manana.

    TicketPatch:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/TicketEstado'
        asignado_id:
          type: string
      example:
        estado: en_proceso
        asignado_id: "64f1a2b3c4d5e6f7a8b9c0b3"

    Comentario:
      type: object
      required: [id, autor_id, cuerpo, creado_en]
      properties:
        id:
          type: string
        autor_id:
          type: string
        cuerpo:
          type: string
        creado_en:
          type: string
          format: date-time
      example:
        id: "64f1a2b3c4d5e6f7a8b9c0e2"
        autor_id: "64f1a2b3c4d5e6f7a8b9c0b3"
        cuerpo: Revisado; cambiaremos la lampara del proyector.
        creado_en: "2026-10-06T12:40:00Z"

    ComentarioCreate:
      type: object
      required: [cuerpo]
      properties:
        cuerpo:
          type: string
          minLength: 1
      example:
        cuerpo: Revisado; cambiaremos la lampara del proyector.

    FemAlumno:
      type: object
      required: [id, nombre, horas_cursadas, horas_totales]
      properties:
        id:
          type: string
        nombre:
          type: string
        empresa:
          type: string
        estado:
          type: string
        horas_cursadas:
          type: number
          minimum: 0
        horas_totales:
          type: number
          example: 500
        tutor_id:
          type: string

    FemHorasPatch:
      type: object
      required: [horas_cursadas]
      properties:
        horas_cursadas:
          type: number
          minimum: 0
          maximum: 500

    DashboardKpis:
      type: object
      properties:
        ausencias_hoy:
          type: integer
        guardias_pendientes:
          type: integer
        tickets_abiertos:
          type: integer
        docentes_activos:
          type: integer
        alumnos_fem_activos:
          type: integer

    OrigenAlta:
      type: string
      enum: [manual, oauth]

    UsuarioMePatch:
      type: object
      additionalProperties: false
      description: |
        Campos que el propio usuario puede rectificar.
        PENDIENTE DE DECISION: campos de perfil para autocompletar PDF sin OAuth.
      properties:
        name:
          type: string
          minLength: 1

    UsuarioRolesPut:
      type: object
      required: [roles]
      additionalProperties: false
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'

    UsuarioDatosPersonales:
      type: object
      description: Exportacion de datos personales (derecho de acceso RGPD)
      required: [usuario, exportado_en]
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        exportado_en:
          type: string
          format: date-time
        ausencias:
          type: array
          items:
            type: object
        tickets:
          type: array
          items:
            type: object
        suscripciones_push:
          type: array
          items:
            $ref: '#/components/schemas/SuscripcionPush'

    RetrasoCreate:
      type: object
      required: [alumno_id, fecha, hora, modulo]
      additionalProperties: false
      properties:
        alumno_id:
          type: string
        fecha:
          type: string
          format: date
        hora:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "08:20"
        modulo:
          type: string
          minLength: 1

    Retraso:
      type: object
      required: [id, alumno_id, fecha, hora, modulo, curso_escolar, registrado_por_id]
      properties:
        id:
          type: string
        alumno_id:
          type: string
        fecha:
          type: string
          format: date
        hora:
          type: string
        modulo:
          type: string
        grupo:
          type: string
        curso_escolar:
          type: string
          example: 2026/2027
        registrado_por_id:
          type: string
        creado_en:
          type: string
          format: date-time

    RetrasoPaginated:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Retraso'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    NotificacionTipo:
      type: string
      enum: [anuncio_destacado, guardia_asignada, horario_modificado, ticket_estado]

    Notificacion:
      type: object
      required: [id, tipo, titulo, leida, creada_en]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/NotificacionTipo'
        titulo:
          type: string
        mensaje:
          type: string
        recurso_tipo:
          type: string
          nullable: true
        recurso_id:
          type: string
          nullable: true
        leida:
          type: boolean
        creada_en:
          type: string
          format: date-time

    NotificacionPaginated:
      type: object
      required: [items, page, limit, total, no_leidas]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        no_leidas:
          type: integer

    NotificacionPatch:
      type: object
      required: [leida]
      additionalProperties: false
      properties:
        leida:
          type: boolean

    SuscripcionPushCreate:
      type: object
      required: [endpoint, keys]
      additionalProperties: false
      properties:
        endpoint:
          type: string
          format: uri
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
        dispositivo:
          type: string
          maxLength: 100

    SuscripcionPush:
      type: object
      required: [id, creada_en]
      description: Las claves de la suscripcion nunca se devuelven al cliente
      properties:
        id:
          type: string
        dispositivo:
          type: string
          nullable: true
        creada_en:
          type: string
          format: date-time

    RegistroAuditoria:
      type: object
      required: [id, usuario_id, accion, recurso_tipo, fecha]
      properties:
        id:
          type: string
        usuario_id:
          type: string
        usuario_nombre:
          type: string
        accion:
          type: string
        recurso_tipo:
          type: string
        recurso_id:
          type: string
          nullable: true
        fecha:
          type: string
          format: date-time
        detalle:
          type: object
          nullable: true

    RegistroAuditoriaPaginated:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistroAuditoria'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
